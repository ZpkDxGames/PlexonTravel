name: Apply Phase 2 candidate

on:
  push:
    branches: [phase2/2.0.0-premium-travel]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/2.0.0-premium-travel
          fetch-depth: 0
      - name: Apply execution-grade Phase 2 patch
        run: |
          python3 scripts/apply-phase2-2.0.0.py
          chmod +x scripts/verify-distribution.sh
          # The Actions token cannot modify workflow files. Keep workflow changes
          # out of this source commit; they are installed separately through the
          # authenticated GitHub repository connection after source application.
          git checkout HEAD -- .github/workflows/build.yml .github/workflows/release.yml .github/workflows/phase2-apply.yml
      - name: Commit candidate source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[phase2-applied] Implement PlexonTravel 2.0.0 premium travel runtime'
          git push origin HEAD:phase2/2.0.0-premium-travel
