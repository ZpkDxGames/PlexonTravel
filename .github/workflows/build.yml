name: Build

on:
  push:
    branches: [main, 'closure/**', 'release/**', 'phase2/**', 'phase3/**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_CANDIDATE_SHA: '0e16f38d0ed52b7dfe4ebbc4ae13f58d4395a70a'
  CORE_SHA256: 'bf4df796e83571e76c06b296c75c5e73ddc8053cb2c587d74c08cd3922e0b4d4'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.5
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.5.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.5/PlexonCore-2.0.5.jar
          echo "${CORE_SHA256}  /tmp/PlexonCore-2.0.5.jar" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=/tmp/PlexonCore-2.0.5.jar -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore -Dversion=2.0.5 -Dpackaging=jar -DgeneratePom=true
      - name: Read version and prove accepted lineage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$ACCEPTED_CANDIDATE_SHA" HEAD
          grep -F '<paper.version>26.2.build.121-stable</paper.version>' pom.xml
          grep -F '<core.version>2.0.5</core.version>' pom.xml
      - name: Test and package
        run: mvn -B -ntp clean verify
      - name: Verify installable JAR
        run: ./scripts/verify-distribution.sh "target/PlexonTravel-${VERSION}.jar"
      - name: Generate exact test and provenance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if not totals['tests'] or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(str(totals))
          pathlib.Path('TEST_SUMMARY.txt').write_text(
              f"{totals['tests']} executed / {totals['failures']} failures / "
              f"{totals['errors']} errors / {totals['skipped']} skipped\n"
              "runtime_certification=NOT_EXECUTED\n",
              encoding='utf-8')
          PY
          jar="target/PlexonTravel-${VERSION}.jar"
          (cd target && sha256sum "PlexonTravel-${VERSION}.jar") > SHA256SUMS.txt
          (cd target && sha256sum --check ../SHA256SUMS.txt)
          size="$(stat -c%s "$jar")"
          digest="$(sha256sum "$jar" | awk '{print $1}')"
          cat > PROVENANCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          source_sha=${GITHUB_SHA}
          version=${VERSION}
          accepted_candidate=${ACCEPTED_CANDIDATE_SHA}
          java=25
          class_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.5
          plexoncore_sha256=${CORE_SHA256}
          rollback_tag=v2.0.0
          rollback_sha=2d29d559e08a98f1e3577fbd3a574e34154c4b71
          standard_command_takeover=ENABLED_BY_DEFAULT
          migration_execution=OPERATOR_GATED
          jar_size=${size}
          jar_sha256=${digest}
          runtime_certification=NOT_EXECUTED
          EOF
          cat TEST_SUMMARY.txt
          cat PROVENANCE.txt
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: PlexonTravel-${{ github.sha }}
          path: |
            target/PlexonTravel-*.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
