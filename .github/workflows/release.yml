name: Release 2.0.0-rc.1

on:
  push:
    tags: ['v2.0.0-rc.1']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-rc.1 >/dev/null 2>&1; then
            echo 'v2.0.0-rc.1 already exists; refusing to replace release assets.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar
      - name: Rebuild exact tag
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        run: ./scripts/verify-distribution.sh target/PlexonTravel-2.0.0-rc.1.jar
      - name: Write test summary
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          text = f"{totals['tests']} executed / {totals['failures']} failures / {totals['errors']} errors / {totals['skipped']} skipped\n"
          open('TEST_SUMMARY.txt', 'w').write(text)
          print(text, end='')
          PY
      - name: Write provenance
        shell: bash
        run: |
          {
            echo 'repository=ZpkDxGames/PlexonTravel'
            echo "source_sha=$GITHUB_SHA"
            echo 'version=2.0.0-rc.1'
            echo 'java=25'
            echo 'class_major=69'
            echo 'plexoncore=2.0.4'
            echo 'plexoncore_sha256=61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
            echo 'rollback_tag=v1.0.1'
            echo 'rollback_sha=772188d55c694deea0bc5ae0bdce0898513499e5'
          } > PROVENANCE.txt
      - name: Create checksum
        run: sha256sum target/PlexonTravel-2.0.0-rc.1.jar | sed 's#target/##' > SHA256SUMS.txt
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-rc.1 target/PlexonTravel-2.0.0-rc.1.jar SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonTravel 2.0.0-rc.1' \
            --notes-file releases/2.0.0-rc.1.md \
            --prerelease
