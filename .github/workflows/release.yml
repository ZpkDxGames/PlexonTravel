name: Release 1.0.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'v1.0.1 already exists; refusing to replace release assets.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.4.jar \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar
      - name: Build candidate
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        run: ./scripts/verify-distribution.sh target/PlexonTravel-1.0.1.jar
      - name: Create checksum
        run: sha256sum target/PlexonTravel-1.0.1.jar | sed 's#target/##' > SHA256SUMS.txt
      - name: Publish immutable v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 target/PlexonTravel-1.0.1.jar SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonTravel 1.0.1' \
            --notes-file releases/1.0.1.md
