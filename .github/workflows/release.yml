name: Release

on:
  push:
    branches: ['release/stable']

permissions:
  contents: write

env:
  ACCEPTED_CANDIDATE_SHA: 'c15fa94a6fcfcdbcf1ef52aa92dbb8faa101724a'
  CORE_SHA256: 'bf4df796e83571e76c06b296c75c5e73ddc8053cb2c587d74c08cd3922e0b4d4'
  ROLLBACK_TAG: v3.0.0
  ROLLBACK_SHA: 1bf92f4ef93ba150e61df524c78799703b5d4ce4

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.5
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.5.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.5/PlexonCore-2.0.5.jar
          echo "${CORE_SHA256}  /tmp/PlexonCore-2.0.5.jar" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=/tmp/PlexonCore-2.0.5.jar -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore -Dversion=2.0.5 -Dpackaging=jar -DgeneratePom=true
      - name: Read project version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify exact stable boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in *-*) echo "Prerelease version cannot use stable publisher: $VERSION" >&2; exit 1;; esac
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha"
          test "$GITHUB_SHA" = "$main_sha"
          git merge-base --is-ancestor "$ACCEPTED_CANDIDATE_SHA" HEAD
          test -f "releases/${VERSION}.md"
          test -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists" >&2
            exit 1
          fi
      - name: Test and package exact stable source
        run: mvn -B -ntp clean verify
      - name: Verify exact distribution
        run: ./scripts/verify-distribution.sh "target/PlexonTravel-${VERSION}.jar"
      - name: Build exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if not totals['tests'] or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(str(totals))
          pathlib.Path('TEST_SUMMARY.txt').write_text(
              f"{totals['tests']} executed / {totals['failures']} failures / "
              f"{totals['errors']} errors / {totals['skipped']} skipped\n"
              "runtime_certification=NOT_EXECUTED\n",
              encoding='utf-8')
          PY
          jar="target/PlexonTravel-${VERSION}.jar"
          (cd target && sha256sum "PlexonTravel-${VERSION}.jar") > SHA256SUMS.txt
          (cd target && sha256sum --check ../SHA256SUMS.txt)
          size="$(stat -c%s "$jar")"
          digest="$(sha256sum "$jar" | awk '{print $1}')"
          cat > PROVENANCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          source_sha=${GITHUB_SHA}
          tag=v${VERSION}
          version=${VERSION}
          accepted_candidate=${ACCEPTED_CANDIDATE_SHA}
          java=25
          class_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.5
          plexoncore_sha256=${CORE_SHA256}
          rollback_tag=${ROLLBACK_TAG}
          rollback_sha=${ROLLBACK_SHA}
          standard_command_takeover=ENABLED_BY_DEFAULT
          migration_execution=OPERATOR_GATED
          jar_size=${size}
          jar_sha256=${digest}
          runtime_certification=NOT_EXECUTED
          EOF
      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "target/PlexonTravel-${VERSION}.jar" \
            SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonTravel ${VERSION}" \
            --notes-file "releases/${VERSION}.md" \
            --latest
      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "v${VERSION}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "v${VERSION}" --json tagName --jq '.tagName')" = "v${VERSION}"
          test "$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)" = "$GITHUB_SHA"
          assets="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')"
          for asset in "PlexonTravel-${VERSION}.jar" SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do
            grep -qx "$asset" <<<"$assets"
          done
          mkdir published
          gh release download "v${VERSION}" --dir published
          (cd published && sha256sum --check SHA256SUMS.txt)
          grep -F "source_sha=${GITHUB_SHA}" published/PROVENANCE.txt
          grep -F 'standard_command_takeover=ENABLED_BY_DEFAULT' published/PROVENANCE.txt
          grep -F 'migration_execution=OPERATOR_GATED' published/PROVENANCE.txt
          grep -F 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PlexonTravel-release-${{ github.sha }}
          path: |
            target/PlexonTravel-*.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
            PROVENANCE.txt
          if-no-files-found: warn
          retention-days: 30
